name: CCFOLIA 새 채팅 알림

on:
  schedule:
    # GitHub Actions의 스케줄은 정확히 5분마다 실행되지 않을 수 있고,
    # 트래픽이 몰리면 몇 분 정도 지연될 수 있습니다.
    - cron: "*/20 * * * *"
        # 스케줄러 재등록 트리거용 사소한 변경
  workflow_dispatch: {}   # Actions 탭에서 수동으로도 실행 가능

permissions:
  contents: write   # state.json을 커밋하기 위해 필요

concurrency:
  group: ccfolia-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: 파이썬 설치
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 의존성 설치
        run: pip install -r requirements.txt

      - name: 새 메시지 확인 및 알림 전송
        env:
          CCFOLIA_ROOM_ID: ${{ vars.CCFOLIA_ROOM_ID }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python ccfolia_watch.py

      - name: 상태 파일 커밋
        run: |
          git config user.name "ccfolia-watch-bot"
          git config user.email "actions@users.noreply.github.com"
          git add state.json
          if git diff --cached --quiet; then
            echo "변경사항 없음"
          else
            git commit -m "상태 업데이트 [skip ci]"
            git pull --rebase origin main
            git push
          fi
